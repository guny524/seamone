[package]
name = "seamone-runtime"
description = "기기 내 녹음, 전사, 검수 증거와 보관함의 단일 작업 경계"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
desktop-whisper = ["seamone-asr/whisper"]
test-support = []

[dependencies]
rtrb = "0.3"
num-traits = "0.2.19"
seamone-core.workspace = true
seamone-asr = { path = "../seamone-asr" }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
rusqlite = { version = "0.39", features = ["bundled", "fallible_uint", "hooks"] }
hound = "3.5.1"
tempfile = "3"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3"] }
uuid = { version = "1.23", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.15.3"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.11.3"
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Com_StructuredStorage"] }

[lints]
workspace = true
