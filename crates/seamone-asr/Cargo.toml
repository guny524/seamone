[package]
name = "seamone-asr"
description = "seamone 의 받아쓰기 엔진 interface, 기기마다 다른 엔진을 이 interface 뒤에서 갈아 끼운다"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
whisper = ["dep:whisper-rs", "dep:sha2", "dep:unicode-segmentation"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
whisper-rs = { version = "=0.16.0", optional = true }
sha2 = { version = "0.10", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }

[dependencies]
seamone-core.workspace = true

[lints]
workspace = true
