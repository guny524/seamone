name: guard-integrity

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard-base:
    uses: ./.github/workflows/guard-base.yml

  base-guards:
    needs: guard-base
    runs-on: ubuntu-22.04
    env:
      LINT_BASE_REF: ${{ needs.guard-base.outputs.policy-commit }}
      GUARD_ALLOW_SELF: ${{ needs.guard-base.outputs.allow-self }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # pull_request의 github.sha는 해당 이벤트의 PR merge commit이다
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - name: Run frozen base guards
        run: |
          python3 -I - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile
          source = pathlib.Path(os.environ.get('SOURCE_ROOT', pathlib.Path.cwd()))
          base = os.environ['LINT_BASE_REF']
          def git(root, *args):
              return subprocess.check_output(['git', *args], cwd=root, text=True, stderr=subprocess.PIPE)
          base = git(source, 'rev-parse', '--verify', '--end-of-options', base + '^{commit}').strip()
          if base == git(source, 'rev-parse', 'HEAD').strip() and os.environ.get('GUARD_ALLOW_SELF') != 'true':
              raise SystemExit('guard base must differ from HEAD')
          scratch = source / '.tmp/base-guards'
          scratch.mkdir(parents=True, exist_ok=True)
          with tempfile.TemporaryDirectory(dir=scratch) as directory:
              root = pathlib.Path(directory)
              subprocess.run(['git', 'clone', '--shared', '--no-checkout', str(source), str(root)], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              git(root, 'read-tree', 'HEAD')
              names = set(filter(None, git(source, 'ls-files', '--cached', '--others', '--exclude-standard', '-z').split('\0')))
              for name in sorted(names):
                  if name.startswith('scripts/'):
                      continue
                  path = source / name
                  if path.is_file():
                      target = root / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, target)
              scripts = root / 'scripts'
              scripts.mkdir(exist_ok=True)
              for name in git(source, 'ls-tree', '-r', '--name-only', base, '--', 'scripts').splitlines():
                  if pathlib.Path(name).suffix in {'.py', '.json'}:
                      (scripts / pathlib.Path(name).name).write_text(git(source, 'show', base + ':' + name))
              checks = sorted(path for path in scripts.glob('check_*.py') if path.stem != 'check_macos_dmg')
              if not checks:
                  raise SystemExit('No base guards; never fall back to head scripts')
              env = os.environ.copy()
              env['LINT_BASE_REF'] = base
              failed = False
              bootstrap = 'import runpy,sys; sys.path.insert(0,sys.argv[1]); sys.argv=sys.argv[2:]; runpy.run_path(sys.argv[0],run_name="__main__")'
              for check in checks:
                  print('base ' + base + ': ' + check.name, flush=True)
                  result = subprocess.run([sys.executable, '-I', '-c', bootstrap, str(scripts), str(check)], cwd=root, env=env)
                  failed |= result.returncode != 0
              raise SystemExit(int(failed))
          PY
