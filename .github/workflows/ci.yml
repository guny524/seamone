name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.6"
  TRUNK_VERSION: "0.22.2"

jobs:
  lint-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 판, 구성요소, wasm 타깃은 rust-toolchain.toml 이 정한다
      - name: Install the Rust toolchain
        run: rustup toolchain install

      # 앱 껍데기(Tauri)가 컴파일할 때 webkit2gtk 같은 Linux 라이브러리가 필요하다
      - name: Install the Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Optional offline desktop engine regression
        run: |
          make lint CARGO_FEATURES=desktop-whisper
          make test CARGO_FEATURES=desktop-whisper

      - name: Install pinned UI build tools
        run: scripts/install-tools.sh

      - name: Install UI regression dependencies
        run: npm ci --prefix app/ui/tests --ignore-scripts --no-audit --no-fund

      - name: UI regression with the runner Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path" || { echo "No Chrome/Chromium executable on this runner" >&2; exit 1; }
          SEAMONE_CHROME="$chrome_path" make ui-test

  research-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        run: python3 -m pip install --user uv==0.13.7

      - name: Install locked research dependencies
        run: uv sync --locked --project research

      - name: Research regression without model or corpus downloads
        run: make -C research test
