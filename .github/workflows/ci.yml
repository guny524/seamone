name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  guard-base:
    uses: ./.github/workflows/guard-base.yml

  lint-test:
    needs: guard-base
    env:
      LINT_BASE_REF: ${{ needs.guard-base.outputs.policy-commit }}
      GUARD_ALLOW_SELF: ${{ needs.guard-base.outputs.allow-self }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # 판, 구성요소, wasm 타깃은 rust-toolchain.toml 이 정한다
      - name: Install the Rust toolchain
        run: rustup toolchain install

      # 앱 껍데기(Tauri)가 컴파일할 때 webkit2gtk 같은 Linux 라이브러리가 필요하다
      - name: Install the Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf xdg-utils

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Structural policy
        run: make check-architecture

      - name: Minimal runtime lint
        if: ${{ !cancelled() }}
        run: make lint-runtime-minimal

      - name: Format and syntax
        if: ${{ !cancelled() }}
        run: make lint-format

      - name: Native workspace lint
        if: ${{ !cancelled() }}
        run: make lint-workspace-code

      - name: WASM lint
        if: ${{ !cancelled() }}
        run: make lint-wasm-code

      - name: Test
        if: ${{ !cancelled() }}
        run: make test

      - name: Runtime doctests without test-support
        if: ${{ !cancelled() }}
        run: make test-runtime-doc

      - name: Optional offline desktop engine lint
        if: ${{ !cancelled() }}
        run: make lint-code CARGO_FEATURES=desktop-whisper

      - name: Optional offline desktop engine regression
        if: ${{ !cancelled() }}
        run: make test CARGO_FEATURES=desktop-whisper

      - name: Install pinned UI build tools
        run: make install-ci-tools

      - name: Install UI regression dependencies
        run: npm ci --prefix app/ui/tests --ignore-scripts --no-audit --no-fund

      - name: UI regression with the runner Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path" || { echo "No Chrome/Chromium executable on this runner" >&2; exit 1; }
          SEAMONE_CHROME="$chrome_path" make ui-test

  domain:
    needs: guard-base
    env:
      LINT_BASE_REF: ${{ needs.guard-base.outputs.policy-commit }}
      GUARD_ALLOW_SELF: ${{ needs.guard-base.outputs.allow-self }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: rustup target add wasm32v1-none
      - run: make check-architecture
      - name: Compile the domain without OS support
        if: ${{ !cancelled() }}
        run: make check-domain

  macos-native-lint:
    needs: guard-base
    env:
      LINT_BASE_REF: ${{ needs.guard-base.outputs.policy-commit }}
      GUARD_ALLOW_SELF: ${{ needs.guard-base.outputs.allow-self }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Add the iOS simulator target on CI
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - name: Structural policy
        run: make check-lint-policy
      - name: Minimal macOS runtime lint
        if: ${{ !cancelled() }}
        run: make lint-runtime-minimal
      - name: Compile and lint the iOS host and runtime
        if: ${{ !cancelled() }}
        run: make lint-ios-code
      - name: Compile and lint the native host and runtime
        if: ${{ !cancelled() }}
        run: make lint-native-code CARGO_FEATURES=desktop-whisper

  research-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        run: python3 -m pip install --user uv==0.13.7

      - name: Install locked research dependencies
        run: uv sync --locked --project research

      - name: Research regression in an isolated network namespace
        run: make -C research test-offline
