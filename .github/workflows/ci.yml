name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # 판, 구성요소, wasm 타깃은 rust-toolchain.toml 이 정한다
      - name: Install the Rust toolchain
        run: rustup toolchain install

      # 앱 껍데기(Tauri)가 컴파일할 때 webkit2gtk 같은 Linux 라이브러리가 필요하다
      - name: Install the Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: make lint

      - name: Test
        run: make test
