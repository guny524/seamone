[package]
name = "seamone-ui"
description = "seamone 화면(Leptos, 브라우저에서 그리는 client side rendering), trunk 가 WASM 으로 빌드한다"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
num-traits = "0.2.19"
seamone-core.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
web-sys = { version = "0.3", features = ["HtmlAudioElement", "HtmlMediaElement", "KeyboardEvent", "HtmlTextAreaElement", "HtmlElement", "Window", "Document", "Storage", "CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData"] }
base64 = "0.22"
hound = "3.5.1"
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.23", features = ["csr"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"

[lints]
workspace = true
