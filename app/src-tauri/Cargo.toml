[package]
name = "seamone"
description = "seamone 앱 껍데기(Tauri 2), 화면은 app/ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `_lib` 접미사는 bin 이름과 겹치지 않게 하려는 것이다(Windows 에서 같은 이름이면 충돌한다,
# https://github.com/rust-lang/cargo/issues/8519). Android 와 iOS 는 이 lib 를 불러 앱을 띄운다.
name = "seamone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
desktop-whisper = ["seamone-runtime/desktop-whisper"]

[build-dependencies]
seamone-core.workspace = true
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
seamone-core.workspace = true
seamone-runtime = { path = "../../crates/seamone-runtime" }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2"
tauri = { version = "2.12.7", features = [] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2.7.1"

[dev-dependencies]
tempfile = "3"
# 시험에서 mock runtime 으로 등록된 command 에 IPC 요청을 보낸다
tauri = { version = "2.12.7", features = ["test"] }

[lints]
workspace = true
